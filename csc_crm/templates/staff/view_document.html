
{% load static %}

<!DOCTYPE html>
<html>

<head>

    <title> Dashboard</title>
    <link rel="stylesheet"
          href="{% static 'staff.css/dashboard.css' %}">  

</head>

<body>
<div class="glass-card">

<h2>View Document</h2>

<br>

<p>
<strong>Name:</strong>
{{ document.name }}
</p>

<br>

<p>
<strong>Certificate ID:</strong>
{{ document.certificate_id }}
</p>

<br>

<p>
<strong>Department:</strong>
{{ document.department }}
</p>

<br>

<p>
      <strong>Status:</strong>

       {% if document.verified %}
   
        <span Style="color:#22c55e;"> ✅ Original Certificate</span>
    
        {% else %}

        <span Style="color:red;">❌ Fake Certificate</span>

        {% endif %}
</p>

<br>


<a href="{{ document.document.url }}"
   target="_blank"
   class="glass-btn">

    Open Document

</a>

</div>

</body>
</html>
