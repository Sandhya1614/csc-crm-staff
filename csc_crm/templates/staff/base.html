<script >
console.log("Glassmorphism Dashboard Loaded");

const cards = document.querySelectorAll('.glass-card');

cards.forEach(card => {

    card.addEventListener('mousemove', e => {

        let x = e.offsetX;
        let y = e.offsetY;

        card.style.background = `
        radial-gradient(
        circle at ${x}px ${y}px,
        rgba(24, 11, 143, 0.2),
        rgba(255,255,255,0.08)
        )
        `;
    });

}); 
</script>
